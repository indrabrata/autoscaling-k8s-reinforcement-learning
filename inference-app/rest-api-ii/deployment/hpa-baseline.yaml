apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: resource-intensive-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: resource-intensive-hpa
  minReplicas: 1
  maxReplicas: 10
  metrics:
  # CPU-based scaling
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70  # Target 70% CPU utilization
  # Memory-based scaling
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70  # Target 70% memory utilization
  # Custom metric: Request rate per pod
  - type: Pods
    pods:
      metric:
        name: app_requests_per_second
      target:
        type: AverageValue
        averageValue: "56"  # 70% of 80 RPS capacity per pod
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0  # Scale up immediately
      policies:
      - type: Percent
        value: 100  # Double the pods
        periodSeconds: 15
      - type: Pods
        value: 2  # Or add 2 pods
        periodSeconds: 15
      selectPolicy: Max  # Use the policy that scales more
    scaleDown:
      stabilizationWindowSeconds: 60  # Wait 60s before scaling down
      policies:
      - type: Percent
        value: 50  # Remove half the pods
        periodSeconds: 15
      - type: Pods
        value: 1  # Or remove 1 pod
        periodSeconds: 15
      selectPolicy: Min  # Use the policy that scales less aggressively
